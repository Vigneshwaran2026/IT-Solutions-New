<script>

let session=null;

  // Replace this fallback with a redirect to signin.html if you require a login session.
  session={email:"admin@example.com",role:"admin",loginTime:new Date().toISOString()};
  localStorage.setItem(SESSION_KEY,JSON.stringify(session));
}
const email=session.email||"admin@example.com";

function renderTasks(){return pageHeader("WORKSPACE","Tasks","Review assignments, deadlines, priorities, and completion status.",`<button class="btn" data-action="export-tasks">↓ Export CSV</button><button class="btn primary" data-action="new-task">＋ Add task</button>`)+`<section class="card">${cardHead("Task tracker","Filter tasks by status, priority, or keyword",`<div class="table-tools"><input id="taskSearch" type="search" placeholder="Search tasks..."><select id="taskStatus"><option value="all">All statuses</option><option>Pending</option><option>In Progress</option><option>Completed</option></select><select id="taskPriority"><option value="all">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>`)}<div class="table-wrap"><table><thead><tr><th>Task ID</th><th>Task</th><th>Project</th><th>Assignee</th><th>Priority</th><th>Due date</th><th>Status</th><th>Action</th></tr></thead><tbody id="taskRows"></tbody></table></div></section>`}
function renderClients(){return pageHeader("MANAGEMENT","Clients","Manage client contacts and engagement status.",`<button class="btn" data-action="export-clients">↓ Export CSV</button><button class="btn primary" data-action="new-client">＋ Add client</button>`)+`<section class="card">${cardHead("Client directory","Search client names, contacts, or email",`<div class="table-tools"><input id="clientSearch" type="search" placeholder="Search clients..."><select id="clientStatus"><option value="all">All statuses</option><option>Active</option><option>Pending</option><option>Inactive</option></select></div>`)}<div class="table-wrap"><table><thead><tr><th>Client ID</th><th>Company</th><th>Contact person</th><th>Email</th><th>Projects</th><th>Status</th><th>Actions</th></tr></thead><tbody id="clientRows"></tbody></table></div></section>`}
function renderTeam(){return pageHeader("MANAGEMENT","Team Members","View team roles and update demo team status.",`<button class="btn" data-action="export-team">↓ Export CSV</button><button class="btn primary" data-action="new-member">＋ Add member</button>`)+`<section class="card">${cardHead("Team directory","Sample team accounts",`<div class="table-tools"><input id="teamSearch" type="search" placeholder="Search team..."><select id="teamStatus"><option value="all">All statuses</option><option>Active</option><option>Inactive</option></select></div>`)}<div class="table-wrap"><table><thead><tr><th>Member ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="teamRows"></tbody></table></div></section>`}
function renderReports(){const done=tasks.filter(t=>t.status==="Completed").length,open=tasks.length-done;return pageHeader("INSIGHTS","Reports & Analytics","Review a quick summary of sample project delivery data.",`<button class="btn primary" data-action="export-report">↓ Download report</button>`)+`<div class="stats">${statsCard("Projects",projects.length,"All demo projects","◈")}${statsCard("Tasks completed",done,"Of "+tasks.length+" sample tasks","✓")}${statsCard("Tasks remaining",open,"Pending or in progress","☑")}${statsCard("Completion rate",Math.round(done/Math.max(tasks.length,1)*100)+"%","Based on demo tasks","▤")}</div><div class="panel-grid"><section class="card">${cardHead("Project status breakdown","Current project records")}<div class="activity-list">${["Active","In Progress","Pending","Completed"].map(s=>{let n=projects.filter(p=>p.status===s).length;return `<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px"><strong style="color:#33294c">${s}</strong><span>${n} project(s)</span></div><div style="height:8px;background:#f0edf7;border-radius:20px;overflow:hidden"><div style="height:100%;width:${n/Math.max(projects.length,1)*100}%;background:var(--tz-prime-c);border-radius:20px"></div></div></div>`}).join("")}</div></section><section class="card">${cardHead("Task status breakdown","Current task records")}<div class="activity-list">${["Pending","In Progress","Completed"].map(s=>{let n=tasks.filter(t=>t.status===s).length;return `<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px"><strong style="color:#33294c">${s}</strong><span>${n} task(s)</span></div><div style="height:8px;background:#f0edf7;border-radius:20px;overflow:hidden"><div style="height:100%;width:${n/Math.max(tasks.length,1)*100}%;background:var(--tz-prime-c);border-radius:20px"></div></div></div>`}).join("")}</div></section></div>`}
function renderMessages(){return pageHeader("COMMUNICATION","Messages","Review sample messages from clients and team members.",`<button class="btn" data-action="mark-all-read">✓ Mark all read</button>`)+`<section class="card">${cardHead("Inbox","Click a message to view its details",`<span class="status pending">${messages.filter(m=>m.unread).length} unread</span>`)}<div class="activity-list">${messages.length?messages.map(m=>`<article class="activity" style="padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer" data-message="${m.id}"><span class="activity-icon">✉</span><div class="activity-text"><strong>${esc(m.subject)} ${m.unread?'<span class="status pending">New</span>':''}</strong><p><b>${esc(m.from)}</b> — ${esc(m.text)}</p><p style="margin-top:6px">${esc(m.date)}</p></div><button class="btn small" data-action="open-message" data-id="${m.id}">Open</button></article>`).join(""):`<div class="empty">No messages in your inbox.</div>`}</div></section>`}
function renderSettings(){return pageHeader("PREFERENCES","Settings","Manage demo dashboard preferences and your current session.")+`<div class="panel-grid"><section class="card">${cardHead("Workspace preferences","These switches update this page only")}<div class="settings-row"><div><strong>Email notifications</strong><p>Show a demo notification when there is an update.</p></div><label class="switch"><input type="checkbox" id="emailNotifications" checked><span></span></label></div><div class="settings-row"><div><strong>Compact table rows</strong><p>Use a tighter table layout for records.</p></div><label class="switch"><input type="checkbox" id="compactRows"><span></span></label></div><div class="settings-row"><div><strong>Confirm before deleting</strong><p>Ask before removing demo records.</p></div><label class="switch"><input type="checkbox" id="confirmDelete" checked><span></span></label></div><div class="form-actions"><button class="btn primary" data-action="save-settings">Save preferences</button></div></section><section class="card">${cardHead("Session details","Current demo login")}<div class="settings-row"><div><strong>Signed-in email</strong><p>${esc(email)}</p></div></div><div class="settings-row"><div><strong>Role</strong><p>Administrator</p></div></div><div class="settings-row"><div><strong>Login time</strong><p>${esc(isNaN(loginDate.getTime())?"—":loginDate.toLocaleString())}</p></div></div><div class="form-actions"><button class="btn danger" data-action="logout">Log out</button></div></section></div>`}
function renderHelp(){return pageHeader("SUPPORT","Help Center","Quick guidance for using this sample IT solutions dashboard.")+`<div class="panel-grid"><section class="card">${cardHead("Getting started")}<div class="activity-list"><div class="activity"><span class="activity-icon">1</span><div class="activity-text"><strong>Use the sidebar</strong><p>Choose a section to view projects, tasks, clients, team, reports, messages, or settings.</p></div></div><div class="activity"><span class="activity-icon">2</span><div class="activity-text"><strong>Search and filter</strong><p>Use the search fields and dropdown filters in tables to narrow the demo data.</p></div></div><div class="activity"><span class="activity-icon">3</span><div class="activity-text"><strong>Export records</strong><p>Use export buttons to download the visible demo dataset as a CSV file.</p></div></div></div></section><section class="card">${cardHead("About this demo")}<p style="font-size:12px;line-height:1.8">This is a front-end demonstration. Changes to projects, tasks, clients, and team members are held in page memory and reset when the page reloads. Do not enter sensitive or real customer data.</p><button class="btn primary" data-page-link="overview">Return to dashboard</button></section></div>`}
function render(){crumb.textContent=titles[activePage]||"Page";document.querySelectorAll(".nav-link").forEach(b=>b.classList.toggle("active",b.dataset.page===activePage));document.getElementById("globalSearch").value=globalQuery;
if(activePage==="overview")content.innerHTML=renderOverview();else if(activePage==="projects")content.innerHTML=renderProjects();else if(activePage==="tasks")content.innerHTML=renderTasks();else if(activePage==="clients")content.innerHTML=renderClients();else if(activePage==="team")content.innerHTML=renderTeam();else if(activePage==="reports")content.innerHTML=renderReports();else if(activePage==="messages")content.innerHTML=renderMessages();else if(activePage==="settings")content.innerHTML=renderSettings();else if(activePage==="help")content.innerHTML=renderHelp();else{activePage="overview";content.innerHTML=renderOverview();}
bindPageEvents();applySearch()}
function applySearch(){
const q=(globalQuery||"").trim();
if(activePage==="overview"){const sq=(document.getElementById("overviewSearch")?.value||q).toLowerCase(),st=document.getElementById("overviewStatus")?.value||"all";const rows=projects.filter(p=>(!sq||[p.name,p.client,p.owner].some(v=>v.toLowerCase().includes(sq)))&&(st==="all"||p.status===st));const el=document.getElementById("overviewRows");if(el)el.innerHTML=tableRows(rows,[{key:"name",render:p=>`<strong>${esc(p.name)}</strong><br><span style="font-size:9px;color:#a09ba9">${esc(p.id)}</span>`},{key:"client"},{key:"owner"},{key:"progress",render:p=>`${p.progress}% <div style="height:4px;width:70px;background:#eee8ff;border-radius:9px;margin-top:5px"><div style="height:4px;width:${p.progress}%;background:var(--tz-prime-c);border-radius:9px"></div></div>`},{key:"status",render:p=>statusPill(p.status)},{key:"action",render:p=>`<button class="btn small" data-action="view-project" data-id="${p.id}">View</button>`}]);}
if(activePage==="projects"){const sq=(document.getElementById("projectSearch")?.value||q).toLowerCase(),st=document.getElementById("projectStatus")?.value||"all";let rows=projects.filter(p=>(!sq||[p.id,p.name,p.client,p.owner].some(v=>v.toLowerCase().includes(sq)))&&(st==="all"||p.status===st));const total=rows.length,per=5,max=Math.max(1,Math.ceil(total/per));pageNumber=Math.min(pageNumber,max);rows=rows.slice((pageNumber-1)*per,pageNumber*per);const el=document.getElementById("projectRows");if(el)el.innerHTML=tableRows(rows,[{key:"id"},{key:"name",render:p=>`<strong>${esc(p.name)}</strong>`},{key:"client"},{key:"owner"},{key:"due"},{key:"progress",render:p=>`${p.progress}%`},{key:"status",render:p=>statusPill(p.status)},{key:"actions",render:p=>`<button class="btn small" data-action="edit-project" data-id="${p.id}">Edit</button> <button class="btn small" data-action="delete-project" data-id="${p.id}">Delete</button>`}]);const sum=document.getElementById("projectSummary");if(sum)sum.textContent=`Showing ${total?((pageNumber-1)*per+1):0}–${Math.min(pageNumber*per,total)} of ${total} projects`;const prev=document.getElementById("projectPrev"),next=document.getElementById("projectNext");if(prev)prev.disabled=pageNumber<=1;if(next)next.disabled=pageNumber>=max}
if(activePage==="tasks"){const sq=(document.getElementById("taskSearch")?.value||q).toLowerCase(),st=document.getElementById("taskStatus")?.value||"all",pr=document.getElementById("taskPriority")?.value||"all";const rows=tasks.filter(t=>(!sq||[t.id,t.title,t.project,t.assignee].some(v=>v.toLowerCase().includes(sq)))&&(st==="all"||t.status===st)&&(pr==="all"||t.priority===pr));const el=document.getElementById("taskRows");if(el)el.innerHTML=tableRows(rows,[{key:"id"},{key:"title",render:t=>`<strong>${esc(t.title)}</strong>`},{key:"project"},{key:"assignee"},{key:"priority"},{key:"due"},{key:"status",render:t=>statusPill(t.status)},{key:"action",render:t=>`<button class="btn small" data-action="toggle-task" data-id="${t.id}">${t.status==="Completed"?"Reopen":"Complete"}</button>`}])}
if(activePage==="clients"){const sq=(document.getElementById("clientSearch")?.value||q).toLowerCase(),st=document.getElementById("clientStatus")?.value||"all";const rows=clients.filter(c=>(!sq||[c.id,c.name,c.contact,c.email].some(v=>v.toLowerCase().includes(sq)))&&(st==="all"||c.status===st));const el=document.getElementById("clientRows");if(el)el.innerHTML=tableRows(rows,[{key:"id"},{key:"name",render:c=>`<strong>${esc(c.name)}</strong>`},{key:"contact"},{key:"email"},{key:"projects"},{key:"status",render:c=>statusPill(c.status)},{key:"actions",render:c=>`<button class="btn small" data-action="edit-client" data-id="${c.id}">Edit</button> <button class="btn small" data-action="delete-client" data-id="${c.id}">Delete</button>`}])}
if(activePage==="team"){const sq=(document.getElementById("teamSearch")?.value||q).toLowerCase(),st=document.getElementById("teamStatus")?.value||"all";const rows=team.filter(t=>(!sq||[t.id,t.name,t.email,t.role].some(v=>v.toLowerCase().includes(sq)))&&(st==="all"||t.status===st));const el=document.getElementById("teamRows");if(el)el.innerHTML=tableRows(rows,[{key:"id"},{key:"name",render:t=>`<strong>${esc(t.name)}</strong>`},{key:"email"},{key:"role"},{key:"status",render:t=>statusPill(t.status)},{key:"action",render:t=>`<button class="btn small" data-action="toggle-member" data-id="${t.id}">${t.status==="Active"?"Deactivate":"Activate"}</button>`}])}
}
function bindPageEvents(){
const listen=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};
["overviewSearch","overviewStatus","projectSearch","projectStatus","taskSearch","taskStatus","taskPriority","clientSearch","clientStatus","teamSearch","teamStatus"].forEach(id=>listen(id,"input",applySearch));
["overviewStatus","projectStatus","taskStatus","taskPriority","clientStatus","teamStatus"].forEach(id=>listen(id,"change",applySearch));
listen("projectPrev","click",()=>{pageNumber=Math.max(1,pageNumber-1);applySearch()});listen("projectNext","click",()=>{pageNumber++;applySearch()});
listen("chartPeriod","change",e=>{const bars=document.querySelectorAll("#projectChart .bar-group");bars.forEach((bar,i)=>bar.style.display=i>=6-Number(e.target.value)?"flex":"none")});
}
function downloadCSV(filename,rows){if(!rows.length){alert("There are no records to export.");return}const keys=Object.keys(rows[0]);const csv=[keys.join(","),...rows.map(row=>keys.map(k=>`"${String(row[k]??"").replace(/"/g,'""')}"`).join(","))].join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function openForm(type,id){let item=null,fields=[],title="";
if(type==="project"){item=projects.find(x=>x.id===id)||{};title=id?"Edit project":"Add project";fields=[["name","Project name",item.name||""],["client","Client",item.client||""],["owner","Owner",item.owner||""],["due","Due date",item.due||"2026-11-30","date"],["progress","Progress (0–100)",item.progress??0,"number"],["status","Status",item.status||"Pending","select",["Active","In Progress","Pending","Completed"]]]}
if(type==="task"){item={};title="Add task";fields=[["title","Task title",""],["project","Project",""],["assignee","Assignee",""],["priority","Priority","Medium","select",["High","Medium","Low"]],["due","Due date","2026-11-30","date"],["status","Status","Pending","select",["Pending","In Progress","Completed"]]]}
if(type==="client"){item=clients.find(x=>x.id===id)||{};title=id?"Edit client":"Add client";fields=[["name","Company name",item.name||""],["contact","Contact person",item.contact||""],["email","Email",item.email||"","email"],["projects","Number of projects",item.projects??0,"number"],["status","Status",item.status||"Active","select",["Active","Pending","Inactive"]]]}
if(type==="member"){item={};title="Add team member";fields=[["name","Full name",""],["email","Email","","email"],["role","Job role",""],["status","Status","Active","select",["Active","Inactive"]]]}
const formHtml=fields.map(([key,label,value,typeField,opts])=>`<div class="form-field ${key==="description"?"full":""}"><label for="modal-${key}">${esc(label)}</label>${typeField==="select"?`<select id="modal-${key}">${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select>`:`<input id="modal-${key}" type="${typeField||"text"}" value="${esc(value)}" ${key==="progress"||key==="projects"?"min='0'":""} ${key==="progress"?"max='100'":""} required>`}</div>`).join("");
const modal=document.createElement("div");modal.style.cssText="position:fixed;inset:0;background:#180d2b66;z-index:100;display:grid;place-items:center;padding:18px";modal.innerHTML=`<section class="card" style="width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #170b2c35"><div class="card-head"><h2>${esc(title)}</h2><button class="btn small" data-modal-close>✕ Close</button></div><form id="dataForm"><div class="form-grid">${formHtml}</div><div class="form-actions"><button class="btn" type="button" data-modal-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form></section>`;document.body.appendChild(modal);
modal.querySelectorAll("[data-modal-close]").forEach(b=>b.addEventListener("click",()=>modal.remove()));
modal.addEventListener("click",e=>{if(e.target===modal)modal.remove()});
modal.querySelector("#dataForm").addEventListener("submit",e=>{e.preventDefault();const data={};for(const [key] of fields){const el=modal.querySelector("#modal-"+key);if(!el.value.trim()){el.focus();return}data[key]=el.type==="number"?Number(el.value):el.value.trim()}
if(type==="project"){if(id)Object.assign(item,data);else projects.unshift({id:"PRJ-"+Date.now().toString().slice(-5),...data,progress:Number(data.progress)||0})}
if(type==="task"){tasks.unshift({id:"TSK-"+Date.now().toString().slice(-5),...data})}
if(type==="client"){if(id)Object.assign(item,data);else clients.unshift({id:"CL-"+Date.now().toString().slice(-5),...data,projects:Number(data.projects)||0})}
if(type==="member")team.unshift({id:"TM-"+Date.now().toString().slice(-5),...data});
modal.remove();render();const n=document.getElementById("pageNotice");if(n){n.className="notice show success";n.textContent="Saved successfully (demo only)."}});
}
function deleteRecord(type,id){const confirmDelete=document.getElementById("confirmDelete");if((!confirmDelete||confirmDelete.checked)&&!confirm("Delete this demo record?"))return;if(type==="project")projects=projects.filter(x=>x.id!==id);if(type==="client")clients=clients.filter(x=>x.id!==id);render();const n=document.getElementById("pageNotice");if(n){n.className="notice show success";n.textContent="Demo record deleted."}}
function handleAction(action,id){
if(action==="new-project")openForm("project");if(action==="edit-project")openForm("project",id);if(action==="delete-project")deleteRecord("project",id);if(action==="view-project"){const p=projects.find(x=>x.id===id);if(p)alert(`${p.name}\nClient: ${p.client}\nOwner: ${p.owner}\nProgress: ${p.progress}%\nStatus: ${p.status}`)}
if(action==="new-task")openForm("task");if(action==="toggle-task"){const t=tasks.find(x=>x.id===id);if(t)t.status=t.status==="Completed"?"Pending":"Completed";render()}
if(action==="new-client")openForm("client");if(action==="edit-client")openForm("client",id);if(action==="delete-client")deleteRecord("client",id);
if(action==="new-member")openForm("member");if(action==="toggle-member"){const t=team.find(x=>x.id===id);if(t)t.status=t.status==="Active"?"Inactive":"Active";render()}
if(action==="export-projects")downloadCSV("stackly-projects.csv",projects);if(action==="export-tasks")downloadCSV("stackly-tasks.csv",tasks);if(action==="export-clients")downloadCSV("stackly-clients.csv",clients);if(action==="export-team")downloadCSV("stackly-team.csv",team);
if(action==="export-report")downloadCSV("stackly-report.csv",[{metric:"Projects",value:projects.length},{metric:"Tasks",value:tasks.length},{metric:"Completed tasks",value:tasks.filter(t=>t.status==="Completed").length}]);
if(action==="mark-all-read"){messages.forEach(m=>m.unread=false);render();const n=document.getElementById("pageNotice");if(n){n.className="notice show success";n.textContent="All messages marked as read."}}
if(action==="open-message"){const m=messages.find(x=>x.id===id);if(m){m.unread=false;alert(`From: ${m.from}\nSubject: ${m.subject}\n\n${m.text}`);render()}}
if(action==="save-settings"){const n=document.getElementById("pageNotice");if(n){n.className="notice show success";n.textContent="Preferences saved for this page session."}}
if(action==="logout"){localStorage.removeItem(SESSION_KEY);location.href="signin.html"}
}
function logout(){
  try{localStorage.removeItem(SESSION_KEY)}catch(e){}
  window.location.replace("signin.html");
}
document.addEventListener("click",e=>{
const nav=e.target.closest("[data-page]");if(nav){activePage=nav.dataset.page;globalQuery="";pageNumber=1;render();sidebar.classList.remove("open");overlay.classList.remove("show");return}
const link=e.target.closest("[data-page-link]");if(link){activePage=link.dataset.pageLink;globalQuery="";render();sidebar.classList.remove("open");overlay.classList.remove("show");return}
const action=e.target.closest("[data-action]");if(action){e.preventDefault();if(action.dataset.action==="logout"){logout();return}window.location.href="404.html";return}
const msg=e.target.closest("[data-message]");if(msg&&!e.target.closest("button")){handleAction("open-message",msg.dataset.message)}
});
document.getElementById("globalSearch").addEventListener("input",e=>{globalQuery=e.target.value;applySearch()});
document.getElementById("notificationsBtn").addEventListener("click",()=>{window.location.href="404.html"});
document.getElementById("logoutBtn").addEventListener("click",logout);
document.getElementById("menuToggle").addEventListener("click",()=>{sidebar.classList.toggle("open");overlay.classList.toggle("show")});
overlay.addEventListener("click",()=>{sidebar.classList.remove("open");overlay.classList.remove("show")});
render();
})();
</script>
